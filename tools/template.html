<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · thoughts</title>
<meta name="description" content="WROP 基准的 7 个后续改进方向。可选中文字匿名评论。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body data-page="{{PAGE_ID}}">
<a class="skip" href="#main">跳到正文</a>
<div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

<header class="hero">
  <div class="hero-inner" data-section="intro" id="intro">
    <p class="eyebrow">thoughts.ycjian.com · 研究笔记</p>
    <h1>{{TITLE}}</h1>
    {{LEAD}}
    <ul class="chips" aria-label="概要">
      <li>7 个方向</li>
      <li>依据作者已承认的问题</li>
      <li>选中文字即可评论</li>
    </ul>
  </div>
</header>

<div class="layout">
  <nav class="toc" aria-label="目录">
    <p class="toc-title">目录</p>
    <ol>{{TOC}}</ol>
    <a class="toc-comments" href="#comments">全部评论 <span class="count" id="toc-count">0</span></a>
  </nav>

  <main id="main">
    <article class="doc">
{{SECTIONS}}
    </article>

    <section class="comments" id="comments" aria-labelledby="comments-h">
      <h2 id="comments-h">评论 <span class="count" id="list-count">0</span></h2>
      <p class="hint">选中正文里的文字。点「评论」按钮。评论会贴在那段文字上。</p>
      <p class="hint">无需登录。昵称可不填。</p>
      <button type="button" class="btn ghost" id="page-comment">评论整篇</button>
      <p class="empty" id="list-empty">还没有评论。</p>
      <ol class="thread-list" id="thread-list"></ol>
    </section>
  </main>
</div>

<footer class="foot">
  <p>来源：<code>wrop-improvement-directions.md</code>。更新于 2026-10-08。</p>
  <p>托管于 Cloudflare。评论匿名存储。</p>
</footer>

<button type="button" class="sel-btn" id="sel-btn" hidden>评论</button>

<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-h" hidden>
  <div class="panel-head">
    <h2 id="panel-h">评论</h2>
    <button type="button" class="icon-btn" id="panel-close" aria-label="关闭">×</button>
  </div>
  <div class="panel-body">
    <blockquote class="panel-quote" id="panel-quote" hidden></blockquote>
    <ol class="thread" id="panel-thread"></ol>
    <form class="composer" id="composer" novalidate>
      <label class="field">
        <span>昵称（可不填）</span>
        <input type="text" id="f-nick" maxlength="40" autocomplete="nickname" placeholder="匿名">
      </label>
      <label class="field">
        <span id="f-body-label">评论</span>
        <textarea id="f-body" maxlength="2000" rows="4" required placeholder="写下你的看法。"></textarea>
      </label>
      <div class="ts" id="ts-box"></div>
      <div class="form-foot">
        <span class="counter" id="f-count">0 / 2000</span>
        <button type="submit" class="btn" id="f-submit">发布</button>
      </div>
      <p class="form-msg" id="f-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
