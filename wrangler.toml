name = "thoughts"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = false

routes = [{ pattern = "thoughts.ycjian.com", custom_domain = true }]

# Pages are embedded into the Worker via src/site.gen.js (python3 tools/build.py).

[[d1_databases]]
binding = "DB"
database_name = "thoughts-comments"
database_id = "4a8bc743-c65d-4353-bfde-444c0fce7783"

# No [vars]. Secrets (set once, never commit):
#   IP_SALT             salt for hashing visitor IPs
#   AGENT_TOKEN_SHA256  sha256 hex of the agent CLI token (raw token: /home/box/.config/thoughts/secrets.env)
